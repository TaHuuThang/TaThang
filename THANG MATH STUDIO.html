 ≠ 3","x ≠ −3","x ≠ 3 và x ≠ −3","x ≠ 9"],2,"Phân thức xác định khi x² − 9 ≠ 0, tức (x − 3)(x + 3) ≠ 0, nên x ≠ 3 và x ≠ −3.",kn),Ze("q8-03",8,"ham-so","Đồ thị hàm số bậc nhất",1,"Đồ thị hàm số y = 3x − 2 cắt trục tung tại điểm:",["(0; −2)","(−2; 0)","(0; 3)","(2/3; 0)"],0,"Cho x = 0 thì y = 3 · 0 − 2 = −2, nên đồ thị cắt trục tung tại (0; −2). Điểm (2/3; 0) là giao điểm với trục hoành.",kn),Ze("q8-04",8,"pythagore","Định lí Pythagore đảo",2,"Bộ ba độ dài nào sau đây là độ dài ba cạnh của một tam giác vuông?",["4 cm, 5 cm, 6 cm","5 cm, 12 cm, 13 cm","6 cm, 7 cm, 9 cm","7 cm, 8 cm, 10 cm"],1,"5² + 12² = 25 + 144 = 169 = 13² nên đó là tam giác vuông (định lí Pythagore đảo). Các bộ còn lại: 4² + 5² = 41 ≠ 36; 6² + 7² = 85 ≠ 81; 7² + 8² = 113 ≠ 100.",kn),Ze("q8-05",8,"thuc-tien","Phần trăm",2,"Một chiếc máy tính giá 8 000 000 đồng được giảm giá 15%. Số tiền phải trả là:",["6 800 000 đồng","1 200 000 đồng","7 850 000 đồng","6 500 000 đồng"],0,"Số tiền được giảm: 8 000 000 × 15% = 1 200 000 đồng. Số tiền phải trả: 8 000 000 − 1 200 000 = 6 800 000 đồng.",kn),Pa("q8-06",8,"phan-thuc","Rút gọn phân thức",2,"Cho phân thức A = (x² − 4)/(x² + 2x).",[["Điều kiện xác định của A là x ≠ 0 và x ≠ −2.",!0,"x² + 2x = x(x + 2) ≠ 0 khi và chỉ khi x ≠ 0 và x ≠ −2."],["Với điều kiện xác định, A = (x − 2)/x.",!0,"A = (x − 2)(x + 2)/[x(x + 2)] = (x − 2)/x."],["Giá trị của A tại x = 2 bằng 1.",!1,"Tại x = 2: A = (2 − 2)/2 = 0."],["Tại x = −2, phân thức A có giá trị bằng 2.",!1,"x = −2 không thỏa mãn điều kiện xác định nên A không xác định tại x = −2, dù biểu thức rút gọn (x − 2)/x cho kết quả 2."]],"Luôn tìm điều kiện xác định trước khi rút gọn và tính giá trị phân thức.",{...kn,time:90}),Pa("q8-07",8,"phuong-trinh","Phương trình bậc nhất một ẩn",2,"Cho phương trình 3(x − 2) = x + 4.",[["x = 5 là nghiệm của phương trình.",!0,"Thay x = 5: vế trái 3 · (5 − 2) = 9, vế phải 5 + 4 = 9."],["Phương trình tương đương với 2x − 10 = 0.",!0,"3x − 6 = x + 4 ⇔ 3x − x − 6 − 4 = 0 ⇔ 2x − 10 = 0."],["Phương trình có hai nghiệm phân biệt.",!1,"2x − 10 = 0 có nghiệm duy nhất x = 5."],["Khi x = 2, vế trái và vế phải của phương trình bằng nhau.",!1,"Khi x = 2: vế trái 3 · (2 − 2) = 0, vế phải 2 + 4 = 6."]],"Giải: 3x − 6 = x + 4 ⇔ 2x = 10 ⇔ x = 5.",{...kn,time:90}),Pa("q8-08",8,"dong-dang","Tam giác đồng dạng",2,"Cho tam giác ABC đồng dạng với tam giác DEF theo tỉ số đồng dạng k = 2 (tức AB/DE = 2). Biết AB = 6 cm và ∠A = 50°.",[["∠D = 50°.",!0,"Hai tam giác đồng dạng có các góc tương ứng bằng nhau nên ∠D = ∠A = 50°."],["DE = 12 cm.",!1,"AB/DE = 2 nên DE = 6 : 2 = 3 cm."],["Tỉ số chu vi của tam giác ABC và tam giác DEF bằng 2.",!0,"Các cạnh tương ứng tỉ lệ theo tỉ số 2 nên tỉ số chu vi cũng bằng 2."],["Tam giác DEF đồng dạng với tam giác ABC theo tỉ số 2.",!1,"DE/AB = 1/2 nên tam giác DEF đồng dạng với tam giác ABC theo tỉ số 1/2."]],"Hai tam giác đồng dạng: các góc tương ứng bằng nhau, các cạnh tương ứng tỉ lệ (không nhất thiết bằng nhau).",{...kn,time:90}),Pa("q8-09",8,"thales","Định lí Thalès và hệ quả",3,"Cho tam giác ABC, điểm M thuộc cạnh AB, điểm N thuộc cạnh AC sao cho MN ∥ BC. Biết AM = 4 cm, MB = 2 cm, AN = 6 cm.",[["AM/AB = AN/AC.",!0,"Theo định lí Thalès trong tam giác ABC với MN ∥ BC."],["AB = 6 cm.",!0,"AB = AM + MB = 4 + 2 = 6 cm."],["NC = 4 cm.",!1,"AM/MB = AN/NC nên 4/2 = 6/NC, suy ra NC = 3 cm."],["MN/BC = 2/3.",!0,"Theo hệ quả của định lí Thalès: MN/BC = AM/AB = 4/6 = 2/3."]],"Định lí Thalès: đường thẳng song song với một cạnh của tam giác định ra trên hai cạnh kia những đoạn thẳng tương ứng tỉ lệ.",{...kn,time:90}),Pa("q8-10",8,"thong-ke","Xác suất của biến cố",2,"Kết quả học tập môn Toán của lớp 8A (40 học sinh): mức Tốt 10 bạn, Khá 16 bạn, Đạt 12 bạn, Chưa đạt 2 bạn.",[["Số học sinh mức Khá chiếm 40% số học sinh cả lớp.",!0,"16 : 40 = 0,4 = 40%."],["Tỉ lệ học sinh mức Chưa đạt là 2%.",!1,"2 : 40 = 0,05 = 5%."],["Chọn ngẫu nhiên một học sinh của lớp, xác suất chọn được học sinh mức Tốt là 1/4.",!0,"Có 10 kết quả thuận lợi trong 40 kết quả đồng khả năng: 10/40 = 1/4."],["Số học sinh mức Đạt ít hơn số học sinh mức Tốt.",!1,"12 > 10 nên số học sinh mức Đạt nhiều hơn số học sinh mức Tốt."]],"Tỉ lệ phần trăm = số học sinh của nhóm : tổng số học sinh × 100%.",{...kn,time:90}),cn("q8-11",8,"dai-so","Giá trị của biểu thức",2,"Tính giá trị của biểu thức x² − 2x + 1 tại x = −3.",["16"],"x² − 2x + 1 = (x − 1)². Tại x = −3: (−3 − 1)² = (−4)² = 16.",kn),cn("q8-12",8,"phan-thuc","Rút gọn và tính giá trị phân thức",2,"Rút gọn phân thức (x² − 1)/(x + 1) rồi tính giá trị tại x = 1/2. Nhập kết quả dạng phân số hoặc số thập phân.",["-1/2"],"Với x ≠ −1: (x² − 1)/(x + 1) = (x − 1)(x + 1)/(x + 1) = x − 1. Tại x = 1/2: 1/2 − 1 = −1/2 = −0,5.",kn),cn("q8-13",8,"pythagore","Ứng dụng định lí Pythagore",3,"Một chiếc thang dài 5 m dựa vào bức tường thẳng đứng, chân thang cách chân tường 1,4 m. Đỉnh thang chạm tường ở độ cao bao nhiêu mét?",["4,8"],"Gọi h là độ cao cần tìm. Theo định lí Pythagore: h² = 5² − 1,4² = 25 − 1,96 = 23,04, nên h = 4,8 m.",{...kn,unit:"m",unitMode:"optional",time:60}),cn("q8-14",8,"dong-dang","Ứng dụng tam giác đồng dạng",3,"Cùng một thời điểm, một chiếc cọc cao 1,5 m có bóng trên mặt đất dài 1,2 m, còn một cột cờ có bóng dài 6 m. Cột cờ cao bao nhiêu mét?",["7,5"],"Các tia nắng song song nên tam giác tạo bởi cọc và bóng đồng dạng với tam giác tạo bởi cột cờ và bóng: h/6 = 1,5/1,2, suy ra h = 6 · 1,5 : 1,2 = 7,5 m.",{...kn,unit:"m",unitMode:"optional",time:60}),cn("q8-15",8,"thuc-tien","Giải bài toán bằng cách lập phương trình",3,"Một mảnh vườn hình chữ nhật có chu vi 50 m, chiều dài hơn chiều rộng 5 m. Tính diện tích mảnh vườn.",["150"],"Gọi chiều rộng là x (m), x > 0; chiều dài là x + 5 (m). Nửa chu vi: x + (x + 5) = 25, suy ra x = 10. Chiều dài 15 m. Diện tích: 10 · 15 = 150 m².",{...kn,unit:"m²",unitMode:"optional",time:90})],tp=[cn("q8-16",8,"dai-so","Phân tích đa thức thành nhân tử",1,"Phân tích đa thức x² − 9 thành nhân tử.",["(x − 3)(x + 3)"],"x² − 9 = x² − 3² = (x − 3)(x + 3). Chấp nhận cả (x + 3)(x − 3)." /quyển.",[["Tổng số tiền nhập vở là 320 000 đồng.",!0,"40 × 8 000 = 320 000 (đồng)."],["Tổng số tiền bán vở là 360 000 đồng.",!1,"40 × 10 000 = 400 000 (đồng)."],["Cửa hàng lãi 25% so với tiền vốn.",!0,"Tiền lãi 400 000 − 320 000 = 80 000; 80 000 : 320 000 = 0,25 = 25%."],["Nếu giảm giá bán 10% thì cửa hàng vẫn có lãi.",!0,"Giá mới 10 000 × 90% = 9 000 đồng, vẫn lớn hơn giá nhập 8 000 đồng."]],"Tiền lãi = Tiền bán − Tiền vốn. Tỉ lệ lãi = Tiền lãi : Tiền vốn × 100%."),Ze("q-s10",7,"dai-so","Lũy thừa",2,"Giá trị của (−2)³ · (−2)² là:",["32","−32","−64","64"],1,"(−2)³ · (−2)² = (−2)⁵ = −32. Lũy thừa bậc lẻ của số âm là số âm."),cn("q-s11",7,"dai-so","Tỉ lệ thức",2,"Tìm x, biết x/4 = 15/6.",["10"],"Từ tỉ lệ thức: x = 4 · 15 / 6 = 60 / 6 = 10."),Ze("q-s12",7,"hinh-hoc","Tổng ba góc trong tam giác",1,"Tam giác ABC có ∠A = 65°, ∠B = 45°. Số đo ∠C là:",["70°","80°","60°","110°"],0,"Tổng ba góc của tam giác bằng 180°: ∠C = 180° − 65° − 45° = 70°."),Pa("q-s13",7,"thong-ke","Số liệu và xác suất",2,"Điểm kiểm tra Toán của 5 bạn trong nhóm là: 7; 8; 6; 9; 10.",[["Điểm trung bình của nhóm là 8.",!0,"(7 + 8 + 6 + 9 + 10) : 5 = 40 : 5 = 8."],["Có đúng 2 bạn có điểm thấp hơn điểm trung bình của nhóm.",!0,"Các điểm thấp hơn 8 là 7 và 6, tức 2 bạn."],["Chọn ngẫu nhiên 1 bạn, xác suất chọn được bạn có điểm từ 9 trở lên là 1/5.",!1,"Có 2 bạn đạt 9 và 10 nên xác suất là 2/5."],["Điểm cao nhất hơn điểm thấp nhất 3 điểm.",!1,"10 − 6 = 4 điểm."]],"Số trung bình cộng = tổng các giá trị chia cho số giá trị."),cn("q-s14",7,"dai-so","Biểu thức đại số",2,"Cho đa thức P(x) = 2x² − 3x + 1. Tính P(−1).",["6"],"P(−1) = 2·(−1)² − 3·(−1) + 1 = 2 + 3 + 1 = 6."),Ze("q-s15",7,"thuc-tien","Đại lượng tỉ lệ nghịch",3,"5 công nhân làm xong một công việc trong 12 ngày. Hỏi 6 công nhân (năng suất như nhau) làm xong công việc đó trong bao nhiêu ngày?",["10 ngày","14,4 ngày","12 ngày","8 ngày"],0,"Số công nhân và số ngày là hai đại lượng tỉ lệ nghịch: 5 · 12 = 6 · x ⇒ x = 60 : 6 = 10 (ngày)."),Ze("q-s16",7,"thuc
