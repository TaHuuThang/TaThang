p",rules:["Mỗi phòng có các đồ vật chứa manh mối. Chạm vào đồ vật để nhận câu hỏi.","Trả lời đúng: lộ chữ số mật mã. Trả lời sai: vẫn lộ chữ số nhưng bị trừ thời gian.","Cửa ghi thứ tự các hình (△ ○ □ ◇). Ghép chữ số theo đúng thứ tự đó để mở khóa.","Thoát hết các phòng trước khi đồng hồ về 0 để chiến thắng.","Mỗi phút còn lại được thưởng 10 điểm trò chơi."],defaults:{totalMinutes:10,penaltySec:30,cluesPerRoom:3},accent:"gold",background:"grid"},tower:{code:"MATH TOWER",name:"Tháp phòng thủ",blurb:"Giải toán để kiếm vàng, xây và nâng cấp tháp, chặn các đợt quái Lỗi Sai tràn vào căn cứ.",mode:"solo",players:"1 người hoặc cả lớp",rules:["Bắt đầu với 80 vàng. Mỗi đợt trả lời vài câu hỏi để nhận thêm vàng (đúng hoàn toàn = 100 vàng).","Dùng vàng xây tháp (80) hoặc nâng cấp tháp (120) ở các ô trống trên bản đồ.",'Bấm "Bắt đầu đợt tấn công": tháp tự bắn quái đang đi trong tầm.',"Quái lọt vào căn cứ làm mất máu. Giữ căn cứ còn máu sau đợt cuối để thắng."],defaults:{baseHp:10,questionsPerWave:2},accent:"emerald",background:"hex"},race:{code:"MATH RACE",name:"Đường đua tri thức",blurb:"Các đội hoặc cá nhân cùng trả lời một câu, ai đúng thì tiến lên. Chuỗi đúng liên tiếp kích hoạt tăng tốc.",mode:"teams",minTeams:1,maxTeams:6,players:"1 người (đua với máy) hoặc 2–6 đội",rules:["Mỗi câu hỏi hiện cho tất cả. Các đội viết đáp án ra bảng con.",'Giáo viên bấm "Hiện đáp án" rồi đánh dấu đội trả lời đúng.',"Đúng hoàn toàn tiến 1 ô; Đúng/Sai tiến theo tỉ lệ điểm đạt được.","Đúng liên tiếp đủ chuỗi thì được tăng tốc thêm nửa ô.","Sai không bị lùi: thành tích đã có luôn được giữ.","Chơi 1 người: đua cùng 3 tay đua máy."],defaults:{boostStreak:3,botLevel:"medium"},accent:"orange",background:"waves"},battle:{code:"MATH BATTLE",name:"Đại chiến các đội",blurb:"Các đội lần lượt trả lời, tích năng lượng để nhân đôi điểm, dùng quyền trợ giúp và tranh tài ở vòng chung kết.",mode:"teams",minTeams:2,maxTeams:6,players:"2–6 đội",rules:["Các đội trả lời theo lượt. Đúng được điểm và 1 ô năng lượng.","Đủ 3 ô năng lượng: kích hoạt NHÂN ĐÔI điểm trò chơi cho câu của lượt đó.","Mỗi đội có 3 quyền trợ giúp, mỗi quyền dùng 1 lần: 50/50, +15 giây, Đổi câu.",'Đội trả lời sai: một đội khác có thể "Cướp điểm" để nhận một nửa số điểm.',"Vòng chung kết: mỗi đội một câu cuối, điểm trò chơi được nhân đôi."],defaults:{helps:!0,allowSteal:!0,finalRound:!0},accent:"rose",background:"nebula"},mystery:{code:"MATH MYSTERY",name:"Thử thách mật mã",blurb:"Mỗi câu đúng giải mã một ký tự của mật mã bí ẩn. Ghép các manh mối và đoán sớm để nhận thưởng lớn.",mode:"solo",players:"1 người hoặc cả lớp",rules:["Mật mã gồm nhiều ký tự bị che. Mỗi câu hỏi gắn với một ký tự.","Trả lời đúng: ký tự đó được lật mở. Trả lời sai: mất manh mối đó.",'Có thể bấm "Giải mã" bất cứ lúc nào. Đoán đúng càng sớm thưởng càng nhiều.',"Đoán sai bị trừ 10 điểm trò chơi. Có tối đa 3 lần đoán."],defaults:{secret:"THALES",hint:"Nhà toán học Hy Lạp cổ đại; định lí về đường thẳng song song cắt hai cạnh tam giác mang tên ông."},accent:"violet",background:"nebula"},tycoon:{code:"MATH TYCOON",name:"Xây dựng thành phố",blurb:"Dùng xu kiếm được từ mỗi câu trả lời để xây nhà, trường học, nhà máy và mở rộng lãnh thổ thành phố Toán học.",mode:"solo",players:"1 người hoặc cả lớp",rules:["Mỗi lượt trả lời một câu hỏi. Đúng hoàn toàn nhận 100 xu.","Cửa hàng và nhà máy tạo thu nhập thêm sau mỗi lượt.","Trường học tăng 10% số xu nhận từ câu trả lời.","Mua đất để mở rộng lãnh thổ khi hết ô trống.","Giá trị thành phố = dân số × 10 + hạnh phúc × 10 + xu còn lại."],defaults:{},accent:"gold",background:"grid"},boss:{code:"BOSS CHALLENGE",name:"Đánh bại trùm cuối",blurb:"Đối đầu trùm cuối của chủ đề qua chuỗi câu hỏi từ dễ đến khó. Giữ chuỗi đúng để tung đòn mạnh hơn.",mode:"solo",players:"1 người hoặc cả lớp",rules:["Câu hỏi được xếp từ dễ đến khó. Mỗi câu đúng gây sát thương bằng điểm của câu.","Đúng liên tiếp tăng hệ số đòn đánh: ×1 → ×1,25 → ×1,5 → … tối đa ×2.","Đạt dưới một nửa điểm câu: trùm phản đòn, mất 1 mạng.","Từ giai đoạn 2, mỗi lần phản đòn trùm còn hồi 5% máu.","Hạ trùm trước khi hết mạng hoặc hết câu hỏi để chiến thắng."],defaults:{lives:3,bossName:""},accent:"rose",background:"nebula"}},e1=Object.keys(Xt),Mu={"dai-so":{name:"Chúa tể Ẩn Số X",glyph:"x"},"hinh-hoc":{name:"Khối Đa Diện Hỗn Loạn",glyph:"△"},"phuong-trinh":{name:"Rồng Phương Trình",glyph:"="},"ham-so":{name:"Bóng Ma Đồ Thị",glyph:"f(x)"},"thong-ke":{name:"Phù Thủy Xác Suất",glyph:"%"},"thuc-tien":{name:"Đại Gia Lãi Suất",glyph:"₫"}},gp={displayName:"Thắng",theme:"dark",fontScale:100,sound:!0,music:!0,volume:80,motion:!0,lastBackupAt:0},oc={questionCount:0,timeMode:"question",fixedTime:30,timeoutRule:"submit",scoring:"standard",shuffleQuestions:!0,shuffleOptions:!0,teamCount:4,teams:Ua.slice()};function n1(t){let e=[...new Set(t)].sort((a,l)=>a-l);return e.length?e.length===1?`Lớp ${e[0]}`:e.every((a,l)=>l===0||a===e[l-1]+1)?`Lớp ${e[0]}–${e[e.length-1]}`:`Lớp ${e.join(", ")}`:""}var a1=["auto","off","quest","escape","tower","race","battle","mystery","tycoon","boss"];var Ea=Date.UTC(2026,9,1,2,0,0),Eu=Date.UTC(2026,9,26,0,0,0),_e=(t,e,n,a,l,i,s,c,o,u={})=>({id:t,type:"mcq",grade:e,topic:n,subtopic:a,difficulty:l,text:i,image:"",options:s,correct:c,explain:o,points:10,time:30,createdAt:Ea,updatedAt:Ea,...u}),nl=(t,e,n,a,l,i,s,c,o={})=>({id:t,type:"tf",grade:e,topic:n,subtopic:a,difficulty:l,text:i,image:"",statements:s.map(([u,r,m])=>({text:u,answer:r,explain:m,points:2.5})),tfScoring:"each",explain:c,points:10,time:75,createdAt:Ea,updatedAt:Ea,...o}),dn=(t,e,n,a,l,i,s,c,o={})=>({id:t,type:"short",grade:e,topic:n,subtopic:a,difficulty:l,text:i,image:"",answers:s,tolerance:0,matchMode:"value",unit:"",unitMode:"none",explain:c,points:10,time:45,createdAt:Ea,updatedAt:Ea,...o}),Yn={createdAt:Eu,updatedAt:Eu},Du=[_e("q8-01",8,"dai-so","Hằng đẳng thức đáng nhớ",1,"Khai triển (2x + 1)² ta được:",["4x² + 1","4x² + 2x + 1","4x² + 4x + 1","2x² + 4x + 1"],2,"(2x + 1)² = (2x)² + 2 · 2x · 1 + 1² = 4x² + 4x + 1.",Yn),_e("q8-02",8,"phan-thuc","Điều kiện xác định của phân thức",2,"Điều kiện xác định của phân thức (x + 1)/(x² − 9) là:",["x ≠ 3","x ≠ −3","x ≠ 3 và x ≠ −3","x ≠ 9"],2,"Phân thức xác định khi x² − 9 ≠ 0, tức (x − 3)(x + 3) ≠ 0, nên x ≠ 3 và x ≠ −3.",Yn),_e("q8-03",8,"ham-so","Đồ thị hàm số bậc nhất",1,"Đồ thị hàm số y = 3x − 2 cắt trục tung tại điểm:",["(0; −2)","(−2; 0)","(0; 3)","(2/3; 0)"],0,"Cho x = 0 thì y = 3 · 0 − 2 = −2, nên đồ thị cắt trục tung tại (0; −2). Điểm (2/3; 0) là giao điểm với trục hoành.",Yn),_e("q8-04",8,"pythagore","Định lí Pythagore đảo",2,"Bộ ba độ dài nào sau đây là độ dài ba cạnh của một tam giác vuông?",["4 cm, 5 cm, 6 cm","5 cm, 12 cm, 13 cm","6 cm, 7 cm, 9 cm","7 cm, 8 cm, 10 cm"],1,"5² + 12² = 25 + 144 = 169 = 13² nên đó là tam giác vuông (định lí Pythagore đảo). Các bộ còn lại: 4² + 5² = 41 ≠ 36; 6² + 7² = 85 ≠ 81; 7² + 8² = 113 ≠ 100.",Yn),_e("q8-05",8,"thuc-tien","Phần trăm",2,"Một chiếc máy tính giá 8 000 000 đồng được giảm giá 15%. Số tiền phải trả là:",["6 800 000 đồng","1 200 000 đồng","7 850 000 đồng","6 500 000 đồng"],0,"Số tiền được giảm: 8 000 000 × 15% = 1 200 000 đồng. Số tiền phải trả: 8 000 000 − 1 200 000 = 6 800 000 đồng.",Yn),nl("q8-06",8,"phan-thuc","Rút gọn phân thức",2,"Cho phân thức A = (x² − 4)/(x² + 2x).",[["Điều kiện xác định của A là x ≠ 0 và x ≠ −2.",!0,"x² + 2x = x(x + 2) ≠ 0 khi và chỉ khi x ≠ 0 và x ≠ −2."],["Với điều kiện xác định, A = (x − 2)/x.",!0,"A = (x − 2)(x + 2)/[x(x + 2)] = (x − 2)/x."],["Giá trị của A tại x = 2 bằng 1.",!1,"Tại x = 2: A = (2 − 2)/2 = 0."],["Tại x = −2, phân thức A có giá trị bằng 2.",!1,"x = −2 không thỏa mãn điều kiện xác định nên A không xác định tại x = −2, dù biểu thức rút gọn (x − 2)/x cho kết quả 2."]],"Luôn tìm điều kiện xác định trước khi rút gọn và tính giá trị phân thức.",{...Yn,time:90}),nl("q8-07",8,"phuong-trinh","Phương trình bậc nhất một ẩn",2,"Cho phương trình 3(x − 2) = x + 4.",[["x = 5 là nghiệm của phương trình.",!0,"Thay x = 5: vế trái 3 · (5 − 2) = 9, vế phải 5 + 4 = 9."],["Phương trình tương đương với 2x − 10 = 0.",!0,"3x − 6 = x + 4 ⇔ 3x − x − 6 − 4 = 0 ⇔ 2x − 10 = 0."],["Phương trình có hai nghiệm phân biệt.",!1,"2x − 10 = 0 có nghiệm duy nhất x = 5."],["Khi x = 2, vế trái và vế phải của phương trình bằng nhau.",!1,"Khi x = 2: vế trái 3 · (2 − 2) = 0, vế phải 2 + 4 = 6."]],"Giải: 3x − 6 = x + 4 ⇔ 2x = 10 ⇔ x = 5.",{...Yn,time:90}),nl("q8-08",8,"dong-dang","Tam giác đồng dạng",2,"Cho tam giác ABC đồng dạng với tam giác DEF theo tỉ số đồng dạng k = 2 (tức AB/DE = 2). Biết AB = 6 cm và ∠A = 50°.",[["∠D = 50°.",!0,"Hai tam giác đồng dạng có các góc tương ứng bằng nhau nên ∠D = ∠A = 50°."],["DE = 12 cm.",!1,"AB/DE = 2 nên DE = 6 : 2 = 3 cm."],["Tỉ số chu vi của tam giác ABC và tam giác DEF bằng 2.",!0,"Các cạnh tương ứng tỉ lệ theo tỉ số 2 nên tỉ số chu vi cũng bằng 2."],["Tam giác DEF đồng dạng với tam giác ABC theo tỉ số 2.",!1,"DE/AB = 1/2 nên tam giác DEF đồng dạng với tam giác ABC theo tỉ số 1/2."]],"Hai tam giác đồng dạng: các góc tương ứng bằng nhau, các cạnh tương ứng tỉ lệ (không nhất thiết bằng nhau).",{...Yn,time:90}),nl("q8-09",8,"thales","Định lí Thalès và hệ quả",3,"Cho tam giác ABC, điểm M thuộc cạnh AB, điểm N thuộc cạnh AC sao cho MN ∥ BC. Biết AM = 4 cm, MB = 2 cm, AN = 6 cm.",[["AM/AB = AN/AC.",!0,"Theo định lí Thalès trong tam giác ABC với MN ∥ BC."],["AB = 6 cm.",!0,"AB = AM + MB = 4 + 2 = 6 cm."],["NC = 4 cm.",!1,"AM/MB = AN/NC nên 4/2 = 6/NC, suy ra NC = 3 cm."],["MN/BC = 2/3.",!0,"Theo hệ quả của định lí Thalès: MN/BC = AM/AB = 4/6 = 2/3."]],"Định lí Thalès: đường thẳng song song với một cạnh của tam giác định ra trên hai cạnh kia những đoạn thẳng tương ứng tỉ lệ.",{...Yn,time:90}),nl("q8-10",8,"thong-ke","Xác suất của biến cố",2,"Kết quả học tập môn Toán của lớp 8A (40 học sinh): mức Tốt 10 bạn, Khá 16 bạn, Đạt 12 bạn, Chưa đạt 2 bạn.",[["Số học sinh mức Khá chiếm 40% số học sinh cả lớp.",!0,"16 : 40 = 0,4 = 40%."],["Tỉ lệ học sinh mức Chưa đạt là 2%.",!1,"2 : 40 = 0,05 = 5%."],["Chọn ngẫu nhiên một học sinh của lớp, xác suất chọn được học sinh mức Tốt là 1/4.",!0,"Có 10 kết quả thuận lợi trong 40 kết quả đồng khả năng: 10/40 = 1/4."],["Số học sinh mức Đạt ít hơn số học sinh mức Tốt.",!1,"12 > 10 nên số học sinh mức Đạt nhiều hơn số học sinh mức Tốt."]],"Tỉ lệ phần trăm = số học sinh của nhóm : tổng số học sinh × 100%.",{...Yn,time:90}),dn("q8-11",8,"dai-so","Giá trị của biểu thức",2,"Tính giá trị của biểu thức x² − 2x + 1 tại x = −3.",["16"],"x² − 2x + 1 = (x − 1)². Tại x = −3: (−3 − 1)² = (−4)² = 16.",Yn),dn("q8-12",8,"phan-thuc","Rút gọn và tính giá trị phân thức",2,"Rút gọn phân thức (x² − 1)/(x + 1) rồi tính giá trị tại x = 1/2. Nhập kết quả dạng phân số hoặc số thập phân.",["-1/2"],"Với x ≠ −1: (x² − 1)/(x + 1) = (x − 1)(x + 1)/(x + 1) = x − 1. Tại x = 1/2: 1/2 − 1 = −1/2 = −0,5.",Yn),dn("q8-13",8,"pythagore","Ứng dụng định lí Pythagore",3,"Một chiếc thang dài 5 m dựa vào bức tường thẳng đứng, chân thang cách chân tường 1,4 m. Đỉnh thang chạm tường ở độ cao bao nhiêu mét?",["4,8"],"Gọi h là độ cao cần tìm. Theo định lí Pythagore: h² = 5² − 1,4² = 25 − 1,96 = 23,04, nên h = 4,8 m.",{...Yn,unit:"m",unitMode:"optional",time:60}),dn("q8-14",8,"dong-dang","Ứng dụng tam giác đồng dạng",3,"Cùng một thời điểm, một chiếc cọc cao 1,5 m có bóng trên mặt đất dài 1,2 m, còn một cột cờ có bóng dài 6 m. Cột cờ cao bao nhiêu mét?",["7,5"],"Các tia nắng song song nên tam giác tạo bởi cọc và bóng đồng dạng với tam giác tạo bởi cột cờ và bóng: h/6 = 1,5/1,2, suy ra h = 6 · 1,5 : 1,2 = 7,5 m.",{...Yn,unit:"m",unitMode:"optional",time:60}),dn("q8-15",8,"thuc-tien","Giải bài toán bằng cách lập phương trình",3,"Một mảnh vườn hình chữ nhật có chu vi 50 m, chiều dài hơn chiều rộng 5 m. Tính diện tích mảnh vườn.",["150"],"Gọi chiều rộng là x (m), x > 0; chiều dài là x + 5 (m). Nửa chu vi: x + (x + 5) = 25, suy ra x = 10. Chiều dài 15 m. Diện tích: 10 · 15 = 150 m².",{...Yn,unit:"m²",unitMode:"optional",time:90})],Ap=[dn("q8-16",8,"dai-so","Phân tích đa thức thành nhân tử",1,"Phân tích đa thức x² − 9 thành nhân tử.",["(x − 3)(x + 3)"],"x² − 9 = x² − 3² = (x − 3)(x + 3). Chấp nhận cả (x + 3)(x − 3).",{...Yn,matchMode:"manual",time:60})],zx=[_e("q-s01",6,"dai-so","Số nguyên",1,"Kết quả của phép tính (−12) + 7 − (−5) là:",["0","−10","10","−14"],0,"(−12) + 7 = −5; sau đó −5 − (−5) = −5 + 5 = 0."),_e("q-s02",6,"dai-so","Ước chung lớn nhất",2,"ƯCLN(36, 48) bằng:",["6","12","24","144"],1,"36 = 2²·3², 48 = 2⁴·3. Lấy các thừa số chung với số mũ nhỏ nhất: 2²·3 = 12. (144 là BCNN.)"),dn("q-s03",6,"dai-so","Phân số",2,"Tính 2/3 + 5/6. Viết kết quả dưới dạng phân số tối giản.",["3/2"],"Quy đồng: 2/3 = 4/6. Ta có 4/6 + 5/6 = 9/6 = 3/2 (hay 1,5)."),_e("q-s04",6,"thuc-tien","Chu vi hình chữ nhật",1,"Một mảnh vườn hình chữ nhật có chiều dài 12 m, chiều rộng 8 m. Chu vi mảnh vườn là:",["20 m","40 m","96 m","48 m"],1,"Chu vi = 2 × (12 + 8) = 2 × 20 = 40 (m). Lưu ý 96 m² là diện tích, không phải chu vi."),nl("q-s05",6,"dai-so","Số nguyên tố",2,"Cho các số: 2; 9; 17; 21; 29.",[["Số 2 là số nguyên tố chẵn duy nhất.",!0,"2 chỉ có hai ước là 1 và 2; mọi số chẵn lớn hơn 2 đều chia hết cho 2 nên là hợp số."],["Số 9 là số nguyên tố.",!1,"9 = 3 · 3 có ba ước 1, 3, 9 nên là hợp số."],["Trong các số đã cho có đúng 3 số nguyên tố.",!0,"Các số nguyên tố là 2, 17, 29. Số 21 = 3 · 7 là hợp số."],["Tổng các số nguyên tố trong dãy bằng 46.",!1,"2 + 17 + 29 = 48, không phải 46."]],"Số nguyên tố là số tự nhiên lớn hơn 1, chỉ có hai ước là 1 và chính nó."),dn("q-s06",6,"thuc-tien","Phần trăm",2,"Một chiếc áo giá 250 000 đồng được giảm 20%. Giá sau khi giảm là bao nhiêu nghìn đồng?",["200","200000"],"Giá sau giảm bằng 80% giá cũ: 250 000 × 80% = 200 000 đồng = 200 nghìn đồng."),_e("q-s07",6,"hinh-hoc","Tính đối xứng",1,"Hình vuông có bao nhiêu trục đối xứng?",["1","2","4","0"],2,"Hình vuông có 4 trục đối xứng: 2 đường chéo và 2 đường thẳng đi qua trung điểm các cặp cạnh đối."),dn("q-s08",6,"dai-so","Số nguyên",1,"Tính (−7) · 6 + 12.",["-30"],"(−7) · 6 = −42; −42 + 12 = −30."),nl("q-s09",6,"thu
